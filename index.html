<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="p5.js"></script>
    <title>Photobooth</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 64
        }
    </style>
</head>

<body>

    <main>
        <div class="vwrapper">
            <pre class="viewer"></pre>
        </div>
    </main>
    <span id="modelabel">Mode: a</span>
    <div class="toolbar">
        <button id="prev" class="red"><span class="material-symbols-outlined">
                arrow_left
            </span></button>
        <button id="next" class="blue"><span class="material-symbols-outlined">
                arrow_right
            </span></button>
    </div>
    <script src="script.js"></script>


</body>

</html>
